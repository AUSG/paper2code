# lightning.pytorch==2.0.0
name: my_experiment
version: my_version_10

seed_everything: 42
trainer:
  accelerator: auto
  precision: 16-mixed
  max_epochs: 200
  deterministic: true
  plugins:
    - AsyncCheckpointIO
  callbacks:
    - class_path: WandbAlert
      init_args:
        monitor: ${model_ckpt.monitor}
        mode: ${model_ckpt.mode}

model:
  class_path: DefaultModel
  init_args:
    net:
      class_path: Cifar10Resnet
      init_args:
        num_classes: 10

    criterion:
      class_path: CrossEntropyLoss

    vis_per_batch: 0

data:
  class_path: Cifar10DataModule
  init_args:
    root: data
    batch_size: 256
    val_split: 0.2
    transforms:
      class_path: DefaultTransforms

optimizer:
  class_path: AdamW
  init_args:
    lr: 0.001
    weight_decay: 0.01

lr_scheduler:
  class_path: LinearWarmupCosineAnnealingLR
  init_args:
    warmup_epochs: 10
    max_epochs: ${trainer.max_epochs}

early_stopping:
  monitor: val/acc
  patience: 1000
  mode: max

model_ckpt:
  # dirpath: "gs://ecstatic-kirch-iqa-dacon"
  monitor: val/acc
  mode: max
  filename: "best-ep={epoch:02d}-val_acc={val/acc:.4f}"
  auto_insert_metric_name: false
# ckpt_path: logs/debug-resume/version_0/fit/checkpoints/last.ckpt

